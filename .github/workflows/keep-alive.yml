name: Keep alive

# A free Supabase project is paused after a week without database activity. Twice a week
# this reads the list of applied migrations from production, which counts as activity and
# also shows whether production is behind main. No player data leaves the database.
on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Check the production database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: wiaeagcvnyzbcxxshmhk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Applied migrations
        run: supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"
