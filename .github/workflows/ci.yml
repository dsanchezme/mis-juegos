name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs, but never a deploy in progress on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: dependencies cannot run code at install time.
      - run: npm ci --ignore-scripts
      - name: Lint and format
        run: npx biome ci .
      - run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% |`;
              console.log(["### Coverage", "| Metric | % |", "|---|---|", ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run build
      - name: Upload site for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  database:
    name: Database, Edge Function and online tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Bundle the Edge Function
        run: npm run build:functions
      # Applies every migration from scratch and serves the Edge Functions.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,postgres-meta,supavisor,vector,logflare
      - name: Lint SQL
        run: supabase db lint --schema online --level warning --fail-on warning
      - name: pgTAP tests (row level security, lobby rules, saving moves)
        run: supabase test db
      - name: Expose the local stack to the tests
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_API_URL \
            --override-name auth.publishable_key=SUPABASE_PUBLISHABLE_KEY \
            | grep -E '^SUPABASE_(API_URL|PUBLISHABLE_KEY)=' | tr -d '"' >> "$GITHUB_ENV"
      - name: Online tests (phones playing through the Edge Function)
        run: npx vitest run --config vitest.online.config.ts
      - run: npx playwright install --with-deps chromium
      - name: Online end-to-end tests (several phones in a room)
        run: npx playwright test --config playwright.online.config.ts
      - name: Upload online Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-online
          path: playwright-report-online
          retention-days: 7
      - name: Edge Function logs
        if: failure()
        run: docker logs supabase_edge_runtime_mis-juegos 2>&1 | tail -100

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Runtime dependencies ship to players: fail on any known high or critical vulnerability.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify registry signatures
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    # Needs "Dependency graph" enabled in Settings → Security (Advanced Security).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block PRs that add vulnerable dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e, database, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
